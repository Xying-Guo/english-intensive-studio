<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>麦克风授权 · Intensive Studio</title><link rel="stylesheet" href="studio.css"><script src="microphone.js" defer></script></head><body><main class="setup-page"><span class="eyebrow">MICROPHONE SETUP</span><h1>让浏览器听到你的练习。</h1><p>此页只请求插件的麦克风权限。点击后，按 Chrome 的提示选择允许。授权成功就会立即释放麦克风，不保存测试录音，也不发送音频。</p><button id="grant-mic" class="button primary">请求麦克风权限</button><div id="mic-result" class="setup-result" role="status"></div><p>如果曾经拒绝，请检查 Chrome 的麦克风权限，以及 Windows 设置中的麦克风访问权限。设置好后回到侧边栏重新录音。</p><p>录音只保留在打开的学习面板内；关闭侧栏前，请先下载需要保留的尝试。</p></main></body></html>
